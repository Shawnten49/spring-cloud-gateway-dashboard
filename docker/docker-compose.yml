# 注意：本机没有 Docker 环境，此文件未在本机验证过，仅作为交付参考。
# 使用方式：在 docker/ 目录执行 docker compose up -d --build
services:
  mysql:
    image: mysql:8.4
    container_name: gd-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: gateway_dashboard
      MYSQL_USER: gateway
      MYSQL_PASSWORD: gateway123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ugateway", "-pgateway123"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../backend
    container_name: gd-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/gateway_dashboard?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: gateway
      SPRING_DATASOURCE_PASSWORD: gateway123
      JWT_SECRET: gateway-dashboard-compose-secret-change-me-0123456789
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    container_name: gd-frontend
    ports:
      - "8088:80"
    depends_on:
      - backend

volumes:
  mysql-data:
